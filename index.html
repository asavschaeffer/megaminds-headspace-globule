<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sol Eremus</title>
    <link rel="stylesheet" href="styles-fresh.css" />
  </head>
  <body>
    <main class="scroll-container">
      <!-- Scene 1: Peak -->
      <section id="scene-peak" class="scene">
        <img
          src="images/sky-mountain-fog.webp"
          class="scene-image"
          alt="Mountain peak through fog to stars" />

        <div class="zones">
          <!-- Order matters: sky → fog → peak (peak on top) -->
          <a href="headspace.html" class="zone zone-sky" data-zone-name="sky">
            <!-- GIMP hand-traced: stars-mountain-peak_sky -->

              viewBox="0 0 1536 1024"
              preserveAspectRatio="none"
              class="zone-svg">
              <path

              C 1.00,474.00 378.00,416.00 847.00,426.00

                1531.00,490.00 1541.00,-8.00 1541.00,-8.00
                1541.00,-8.00 -9.00,-6.00 -8.00,-6.00" />
            </svg>
            <div class="zone-effect">
              <div class="effect-stars"></div>
            </div>
            <span class="zone-label zone-label-sky">HEADSPACE</span>
          </a>

          <a
            href="#scene-mid-mountain"
            class="zone zone-fog"
            data-zone-name="fog">
            <!-- GIMP hand-traced: stars-mountain-peak_cloud -->
            <svg
              viewBox="0 0 1536 1024"
              preserveAspectRatio="none"
              class="zone-svg">

                1534.00,1019.00 1535.00,1026.00 1535.00,1017.00M 1387.00,1042.00" />
            </svg>
            <div class="zone-effect">
              <div class="effect-fog"></div>
            </div>
            <span class="zone-label">Descend Through Clouds</span>
          </a>

          <a href="peak.html" class="zone zone-peak" data-zone-name="mountain">
            <!-- GIMP-traced SVG boundary - maps perfectly to scene dimensions -->
            <svg
              viewBox="0 0 1536 1024"
              preserveAspectRatio="none"
              class="zone-svg">
              <path
                d="M 872.00,424.00
              C 872.00,424.00 996.00,545.00 997.00,545.00
                998.00,545.00 1100.00,554.00 1100.00,554.00
                1100.00,554.00 1167.00,594.00 1167.00,594.00
                1167.00,594.00 1157.00,741.00 1157.00,741.00
                1157.00,741.00 1124.00,959.00 1124.00,959.00

                271.00,612.00 393.00,655.00 425.00,656.00
                457.00,657.00 531.00,640.00 531.00,640.00
                531.00,640.00 607.00,578.00 607.00,578.00
                607.00,578.00 689.00,530.00 689.00,530.00
                689.00,530.00 769.00,481.00 769.00,481.00
                769.00,481.00 827.00,451.00 827.00,451.00" />
            </svg>
            <div class="zone-effect">
              <div class="effect-glow"></div>
            </div>
            <span class="zone-label">Ascend the Summit</span>
          </a>
        </div>
      </section>

      <!-- Scene 2: Mid-Mountain -->
      <section id="scene-mid-mountain" class="scene">
        <img
          src="images/fog-shrouded-mountain-green-slopes.jpeg"
          class="scene-image"
          alt="Foggy green mountain slopes" />

        <div class="zones">
          <a href="#scene-peak" class="zone zone-fog-top" data-zone-name="fog">
            <div class="zone-effect">
              <div class="effect-fog-reverse"></div>
            </div>
            <span class="zone-label">Return Above</span>
          </a>

          <a href="#forest" class="zone zone-forest" data-zone-name="forest">
            <div class="zone-effect">
              <div class="effect-forest"></div>
            </div>
            <span class="zone-label">Enter the Forest</span>
          </a>

          <a href="#scene-cave" class="zone zone-valley" data-zone-name="fog">
            <div class="zone-effect">
              <div class="effect-mist"></div>
            </div>
            <span class="zone-label">Deeper Into Mist</span>
          </a>
        </div>
      </section>

      <!-- Scene 3: Cave -->
      <section id="scene-cave" class="scene">
        <img
          src="images/dark-cave-waterfall-traverse-person-path-cliff.png"
          class="scene-image"
          alt="Dark cave with waterfall" />

        <div class="zones">
          <a
            href="#cave-depths"
            class="zone zone-cave-left"
            data-zone-name="cave">
            <div class="zone-effect">
              <div class="effect-torch"></div>
            </div>
            <span class="zone-label">Cave Depths</span>
          </a>

          <a
            href="#waterfall"
            class="zone zone-waterfall"
            data-zone-name="water">
            <div class="zone-effect">
              <div class="effect-water"></div>
            </div>
            <span class="zone-label">Follow the Water</span>
          </a>

          <a
            href="#scene-cliff-edge"
            class="zone zone-path"
            data-zone-name="path">
            <div class="zone-effect">
              <div class="effect-shadow"></div>
            </div>
            <span class="zone-label">Continue Forward</span>
          </a>
        </div>
      </section>

      <!-- Scene 4: Cliff Edge -->
      <section id="scene-cliff-edge" class="scene">
        <img
          src="images/dramatic-cliff-view-stormy-sea-waterfalling-into-bottomless-pit-mountain-horizon-adventure-nature-photography.jpg"
          class="scene-image"
          alt="Dramatic cliff with storm and abyss" />

        <div class="zones">
          <a href="#open-sea" class="zone zone-storm" data-zone-name="storm">
            <div class="zone-effect">
              <div class="effect-lightning"></div>
            </div>
            <span class="zone-label">Brave the Storm</span>
          </a>

          <a
            href="cliff-edge-pit.html"
            class="zone zone-pit"
            data-zone-name="abyss">
            <div class="zone-effect">
              <div class="effect-abyss-swirl"></div>
            </div>
            <span class="zone-label">Gaze Into Abyss</span>
          </a>

          <a
            href="#scene-purgatorio"
            class="zone zone-ground"
            data-zone-name="earth">
            <div class="zone-effect">
              <div class="effect-ground"></div>
            </div>
            <span class="zone-label">Find Solid Ground</span>
          </a>
        </div>
      </section>

      <!-- Scene 5: Purgatorio -->
      <section id="scene-purgatorio" class="scene">
        <img
          src="images/i kinda cookedv13.png"
          class="scene-image"
          alt="Icy mountain island in turbulent sea" />

        <div class="zones">
          <a
            href="#purgatorio-ascent"
            class="zone zone-clouds"
            data-zone-name="sky">
            <div class="zone-effect">
              <div class="effect-clouds"></div>
            </div>
            <span class="zone-label">Ascend to Light</span>
          </a>

          <a
            href="#purgatorio-climb"
            class="zone zone-mountain-island"
            data-zone-name="mountain">
            <div class="zone-effect">
              <div class="effect-ice-glimmer"></div>
            </div>
            <span class="zone-label">Scale the Heights</span>
          </a>

          <a href="#scene-peak" class="zone zone-sea" data-zone-name="water">
            <div class="zone-effect">
              <div class="effect-waves"></div>
            </div>
            <span class="zone-label">Return to Origin</span>
          </a>
        </div>
      </section>
    </main>

    <!-- Small in-page blend tester (toggle with B) -->
    <div class="blend-panel" role="region" aria-label="Blend mode tester">
      <label for="blendSelect">HEADSPACE blend:</label>
      <select id="blendSelect" aria-label="Select blend mode">
        <option value="overlay">overlay</option>
        <option value="screen">screen</option>
        <option value="soft-light">soft-light</option>
        <option value="hard-light">hard-light</option>
        <option value="multiply">multiply</option>
        <option value="lighten">lighten</option>
        <option value="difference">difference</option>
        <option value="normal">normal</option>
      </select>
      <button type="button" id="blendApply">Apply</button>
    </div>

    <script src="enhancer-fresh.js"></script>
  </body>
</html>
